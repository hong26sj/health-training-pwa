name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "styles.css"
      - "charts.css"
      - "nutrition.css"
      - "js/**"
      - "tests/**"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/prepare-web.mjs"
      - ".github/workflows/build-ios-ipa.yml"

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Capacitor
        run: npm install

      - name: Test health data engine
        run: npm test

      - name: Prepare web assets
        run: npm run ios:prepare

      - name: Generate iOS project
        run: npx cap add ios

      - name: Sync web assets
        run: npx cap sync ios

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          rm -rf Payload HealthTraining-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry HealthTraining-unsigned.ipa Payload
          ls -lh HealthTraining-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HealthTraining-unsigned-ipa
          path: HealthTraining-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
