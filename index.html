<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Health Training" />
  <title>Health Training</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <div class="date-label" id="dateLabel"></div>
        <h1 id="pageTitle">오늘</h1>
      </div>
      <button class="round-btn" id="syncBtn" aria-label="새로고침">↻</button>
    </header>

    <main id="appMain" class="app-main"></main>

    <nav class="bottom-nav" aria-label="주요 메뉴">
      <button class="nav-item active" data-route="today"><span>▣</span><small>오늘</small></button>
      <button class="nav-item" data-route="health"><span>◇</span><small>건강</small></button>
      <button class="nav-item" data-route="journal"><span>◎</span><small>기록</small></button>
      <button class="nav-item" data-route="workout"><span>ϟ</span><small>운동</small></button>
      <button class="nav-item" data-route="training"><span>▽</span><small>트레이닝</small></button>
    </nav>
  </div>

  <template id="metricCardTemplate">
    <button class="metric-card">
      <div class="metric-title"></div>
      <div class="metric-visual"></div>
      <div class="metric-value-row"><strong class="metric-value"></strong><span class="metric-status"></span></div>
    </button>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
